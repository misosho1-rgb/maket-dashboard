name: 미국 뉴스 Top10 자동 수집

# 퍼블릭 저장소 기준: GitHub Actions 분(minute) 소모가 과금/한도에 안 잡혀서
# 무료로 여유 있게 돌릴 수 있음. 30분 간격으로 설정.
#
# 참고:
# - GitHub는 부하가 몰리면 예약된 시각보다 몇 분 늦게 실행할 수 있음 (보장 X)
# - 저장소에 60일 넘게 커밋이 없으면 GitHub이 스케줄 실행을 자동으로 비활성화함
#   -> 그럴 땐 Actions 탭에서 워크플로우를 다시 활성화(Enable)해주면 됨
permissions:
  contents: write   # 결과 파일을 저장소에 커밋/푸시하려면 필요

on:
  schedule:
    - cron: "*/30 * * * *"  # 30분마다 (UTC 기준)
  workflow_dispatch: {}      # Actions 탭에서 수동으로도 바로 실행 가능

# 같은 워크플로우가 겹쳐 돌지 않도록: 이전 실행이 안 끝났으면 대기
concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install feedparser

      - name: 뉴스 수집 스크립트 실행
        run: python fetch_us_news.py

      - name: 결과 파일 커밋 & 푸시
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add us_news_top10.json
          # 변경 사항이 있을 때만 커밋 (매번 동일하면 빈 커밋 방지)
          git diff --cached --quiet || git commit -m "chore: 뉴스 데이터 자동 갱신 [skip ci]"
          git push
